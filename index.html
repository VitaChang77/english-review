<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3557a6"><title>五年級英文｜考前練習室</title><style>:root{font-family:system-ui,-apple-system,sans-serif;background:#f3f6ff;color:#27344e}*{box-sizing:border-box}body{margin:0}.top{background:linear-gradient(110deg,#3557a6,#6386d5);color:white;padding:28px 20px;border-radius:0 0 24px 24px}.inside,.main{max-width:830px;margin:auto}h1{margin:5px 0;font-size:30px}.main{padding:15px 17px 60px}.card{background:white;border-radius:18px;padding:20px;margin:13px 0;box-shadow:0 5px 20px #243e7e10}h2{margin-top:0}p{line-height:1.7}.badge{display:inline-block;background:#e5edff;color:#3557a6;border-radius:24px;padding:5px 11px;font-size:13px;font-weight:700}button,select,input{font:inherit;min-height:45px;border-radius:12px;padding:11px}button{border:0;background:#3557a6;color:white;font-weight:700;cursor:pointer}button.light{background:#e8eeff;color:#3557a6}.choices{display:grid;gap:9px}.choices button{color:#263552;background:#f4f7ff;text-align:left;border:2px solid transparent}.choices button.selected{border-color:#3557a6;background:#e2ebff}.choices button.right{border-color:#26905c}.choices button.wrong{border-color:#cf5264}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}select{width:100%;border:1px solid #cdd9f5;background:white}input{width:100%;border:1px solid #b4c7eb}small,.muted{color:#61718f}.progress{height:10px;background:#e8edfa;border-radius:10px;overflow:hidden;margin:15px 0}.progress>div{height:100%;background:#6488d9}.sentence{font-size:21px;font-weight:700;line-height:1.6}.score{font-size:52px;color:#3557a6;font-weight:800}.answer{padding:12px;background:#eff6ff;border-radius:12px;margin-top:12px}.tabs button{background:white;color:#3557a6}.tabs button.active{background:#1f3571;color:white}.note{background:#edf2ff;padding:13px;border-radius:12px}.review{border-top:1px solid #e4ebfa;padding:12px 0}</style></head><body><header class="top"><div class="inside"><span>國小五年級・英文</span><h1>English Quest 英文考前練習室</h1><p>依照片中的 Unit 1、Unit 2 與兩張評量卷題型設計｜可在 iPad 使用</p></div></header><main class="main"><div class="row tabs"><button onclick="screen('home')">複習重點</button><button onclick="screen('practice')">小練習</button><button onclick="screen('exam')">模擬考</button><button onclick="screen('history')">成績紀錄</button></div><div id="app"></div></main><script>const Q=[{"type": "vocab", "p": "「星期一」的英文是？", "opts": ["Monday", "Friday", "Sunday", "math"], "ans": 0, "ex": "星期一 = Monday。"}, {"type": "vocab", "p": "「星期二」的英文是？", "opts": ["Tuesday", "Monday", "Friday", "Sunday"], "ans": 0, "ex": "星期二 = Tuesday。"}, {"type": "vocab", "p": "「星期三」的英文是？", "opts": ["Wednesday", "Monday", "Friday", "Sunday"], "ans": 0, "ex": "星期三 = Wednesday。"}, {"type": "vocab", "p": "「星期四」的英文是？", "opts": ["Thursday", "Monday", "Friday", "Sunday"], "ans": 0, "ex": "星期四 = Thursday。"}, {"type": "vocab", "p": "「星期五」的英文是？", "opts": ["Friday", "Monday", "Sunday", "math"], "ans": 0, "ex": "星期五 = Friday。"}, {"type": "vocab", "p": "「星期六」的英文是？", "opts": ["Saturday", "Monday", "Friday", "Sunday"], "ans": 0, "ex": "星期六 = Saturday。"}, {"type": "vocab", "p": "「星期日」的英文是？", "opts": ["Sunday", "Monday", "Friday", "math"], "ans": 0, "ex": "星期日 = Sunday。"}, {"type": "vocab", "p": "「數學」的英文是？", "opts": ["math", "Monday", "Friday", "Sunday"], "ans": 0, "ex": "數學 = math。"}, {"type": "vocab", "p": "「英語」的英文是？", "opts": ["English", "Monday", "Friday", "Sunday"], "ans": 0, "ex": "英語 = English。"}, {"type": "vocab", "p": "「藝術」的英文是？", "opts": ["art", "Monday", "Friday", "Sunday"], "ans": 0, "ex": "藝術 = art。"}, {"type": "vocab", "p": "「音樂」的英文是？", "opts": ["music", "Monday", "Friday", "Sunday"], "ans": 0, "ex": "音樂 = music。"}, {"type": "vocab", "p": "「自然科學」的英文是？", "opts": ["science", "Monday", "Friday", "Sunday"], "ans": 0, "ex": "自然科學 = science。"}, {"type": "vocab", "p": "「社會」的英文是？", "opts": ["social studies", "Monday", "Friday", "Sunday"], "ans": 0, "ex": "社會 = social studies。"}, {"type": "vocab", "p": "「體育」的英文是？", "opts": ["PE", "Monday", "Friday", "Sunday"], "ans": 0, "ex": "體育 = PE。"}, {"type": "vocab", "p": "「中文」的英文是？", "opts": ["Chinese", "Monday", "Friday", "Sunday"], "ans": 0, "ex": "中文 = Chinese。"}, {"type": "vocab", "p": "「四十」的英文是？", "opts": ["forty", "Monday", "Friday", "Sunday"], "ans": 0, "ex": "四十 = forty。"}, {"type": "vocab", "p": "「八十」的英文是？", "opts": ["eighty", "Monday", "Friday", "Sunday"], "ans": 0, "ex": "八十 = eighty。"}, {"type": "vocab", "p": "「一百」的英文是？", "opts": ["one hundred", "Monday", "Friday", "Sunday"], "ans": 0, "ex": "一百 = one hundred。"}, {"type": "grammar", "p": "What ___ is today?", "opts": ["day", "color", "time", "class"], "ans": 0, "ex": "What day is today?"}, {"type": "grammar", "p": "It ___ Friday today.", "opts": ["are", "am", "is", "be"], "ans": 2, "ex": "It is Friday today."}, {"type": "grammar", "p": "___ it Monday today?", "opts": ["Do", "Does", "Is", "Are"], "ans": 2, "ex": "Is it Monday today?"}, {"type": "grammar", "p": "No, it ___. It is Tuesday.", "opts": ["doesn't", "isn't", "aren't", "don't"], "ans": 1, "ex": "No, it isn't."}, {"type": "grammar", "p": "Do you ___ math class on Monday?", "opts": ["has", "have", "having", "had"], "ans": 1, "ex": "Do 後使用動詞原形 have。"}, {"type": "grammar", "p": "___ he have English class on Thursday?", "opts": ["Do", "Does", "Is", "Are"], "ans": 1, "ex": "he 用 Does。"}, {"type": "grammar", "p": "Yes, he ___.", "opts": ["do", "does", "is", "has"], "ans": 1, "ex": "Does he...? Yes, he does."}, {"type": "grammar", "p": "No, I ___.", "opts": ["doesn't", "don't", "isn't", "aren't"], "ans": 1, "ex": "Do you...? No, I don't."}, {"type": "grammar", "p": "What ___ is your favorite subject?", "opts": ["day", "class", "subject", "color"], "ans": 2, "ex": "favorite subject = 最喜歡的科目。"}, {"type": "grammar", "p": "We have ___ class tomorrow.", "opts": ["an PE", "PE", "a PE", "the PE"], "ans": 1, "ex": "課表上的科目名稱前一般不加 a/an。"}, {"type": "grammar", "p": "___ is my favorite subject.", "opts": ["english", "English", "ENGLISH class", "an English"], "ans": 1, "ex": "科目 English 大寫。"}, {"type": "grammar", "p": "He ___ sleeping under the table.", "opts": ["am", "are", "is", "do"], "ans": 2, "ex": "He 搭配 is。"}, {"type": "grammar", "p": "Tom and Peter ___ playing with toys.", "opts": ["am", "is", "are", "does"], "ans": 2, "ex": "複數主語用 are。"}, {"type": "grammar", "p": "Dad is cooking ___ the kitchen.", "opts": ["in", "under", "at", "on"], "ans": 0, "ex": "in the kitchen = 在廚房裡。"}, {"type": "grammar", "p": "The dog is hiding ___ the table.", "opts": ["in", "by", "under", "on"], "ans": 2, "ex": "under the table = 桌子下面。"}, {"type": "grammar", "p": "20 + 60 = ___", "opts": ["seventy", "ninety", "eighty", "sixty"], "ans": 2, "ex": "eighty = 80。"}, {"type": "grammar", "p": "I can ___ myself in the mirror.", "opts": ["taste", "hear", "see", "smell"], "ans": 2, "ex": "用眼睛 see。"}, {"type": "grammar", "p": "I use my nose to ___.", "opts": ["hear", "smell", "see", "feel"], "ans": 1, "ex": "鼻子聞 smell。"}, {"type": "grammar", "p": "I use my ears to ___.", "opts": ["hear", "smell", "taste", "feel"], "ans": 0, "ex": "耳朵聽 hear。"}, {"type": "grammar", "p": "When I go to the beach, I ___ the wet sand.", "opts": ["see", "smell", "feel", "hear"], "ans": 2, "ex": "觸摸沙子 feel。"}, {"type": "grammar", "p": "I can ___ something sweet.", "opts": ["taste", "hear", "see", "smell"], "ans": 0, "ex": "甜味 taste。"}, {"type": "grammar", "p": "Which sentence is correct?", "opts": ["They are my teammate.", "It is Sunday today?", "I'm in a hurry.", "She don't have PE."], "ans": 2, "ex": "I'm in a hurry. 語法正確。"}, {"type": "grammar", "p": "Can we go and watch?", "opts": ["No, you can.", "Sure! Follow me.", "Yes, we does.", "No, I do."], "ans": 1, "ex": "Sure! Follow me. 回應邀請合理。"}, {"type": "grammar", "p": "A: Do you have art class on Friday? B: ___", "opts": ["No, I don't.", "Yes, you do.", "I love art class.", "Yes, it is."], "ans": 0, "ex": "應以 Yes, I do / No, I don't 回答。"}, {"type": "grammar", "p": "A: Does Amy have art class on Sunday? B: ___", "opts": ["No, she does.", "Yes, she is.", "No, she doesn't.", "Yes, I do."], "ans": 2, "ex": "Does 問句用 does/doesn't 回答。"}, {"type": "grammar", "p": "A: Does he have PE class on Sunday? B: Yes, ___", "opts": ["he is", "he does", "he do", "I do"], "ans": 1, "ex": "Yes, he does."}, {"type": "grammar", "p": "今天是星期二。回答 Is it Friday today?", "opts": ["Yes, it is.", "No, it isn't. It's Tuesday.", "No, I do.", "Yes, I am."], "ans": 1, "ex": "否定回答並補充 Tuesday。"}, {"type": "grammar", "p": "It is Thursday today. Tomorrow is ___.", "opts": ["Wednesday", "Friday", "Tuesday", "Monday"], "ans": 1, "ex": "Thursday 的隔天是 Friday。"}, {"type": "grammar", "p": "圖上顯示 Friday 有 art class。Do they have art class on Friday?", "opts": ["Yes, they do.", "Yes, they are.", "No, they do.", "Yes, he does."], "ans": 0, "ex": "Do they...? Yes, they do."}, {"type": "grammar", "p": "A: What ___ is it? B: It is Thursday.", "opts": ["day", "days", "subject", "time"], "ans": 0, "ex": "What day is it?"}, {"type": "grammar", "p": "Look! The children ___ reading books.", "opts": ["is", "am", "are", "does"], "ans": 2, "ex": "children 為複數，be 動詞 are。"}, {"type": "grammar", "p": "___ you have music class on Tuesday?", "opts": ["Does", "Are", "Do", "Is"], "ans": 2, "ex": "you 用 Do。"}, {"type": "grammar", "p": "Mary ___ have science class on Monday.", "opts": ["don't", "doesn't", "isn't", "aren't"], "ans": 1, "ex": "Mary 為第三人稱單數。"}, {"type": "grammar", "p": "Which word is different?", "opts": ["juice", "fruit", "meat", "use"], "ans": 3, "ex": "use 是動詞；其他是食物/飲品。"}, {"type": "grammar", "p": "Which word is different?", "opts": ["shirt", "skirt", "jeans", "beach"], "ans": 3, "ex": "beach 是地點；其他是衣物。"}, {"type": "typing", "p": "今天星期幾？（用英文問句）", "opts": [], "ans": "What day is today?", "ex": "What day is today?"}, {"type": "typing", "p": "今天是星期五。（完整句）", "opts": [], "ans": "It's Friday.", "ex": "It's Friday."}, {"type": "typing", "p": "今天不是星期一。（簡短回答）", "opts": [], "ans": "No, it isn't.", "ex": "No, it isn't."}, {"type": "typing", "p": "他星期四有英文課嗎？", "opts": [], "ans": "Does he have English class on Thursday?", "ex": "Does 後使用 have。"}, {"type": "typing", "p": "不，他沒有。（回覆 Does he...?）", "opts": [], "ans": "No, he doesn't.", "ex": "No, he doesn't."}, {"type": "typing", "p": "是的，我有。（回覆 Do you...?）", "opts": [], "ans": "Yes, I do.", "ex": "Yes, I do."}, {"type": "typing", "p": "正在桌子底下睡覺。（He 開頭）", "opts": [], "ans": "He's sleeping under the table.", "ex": "He's sleeping under the table."}, {"type": "typing", "p": "星期三（英文單字）", "opts": [], "ans": "Wednesday", "ex": "星期拼字、首字大寫。"}, {"type": "typing", "p": "社會（英文科目）", "opts": [], "ans": "social studies", "ex": "兩個字，注意拼字。"}, {"type": "typing", "p": "自然科學（英文科目）", "opts": [], "ans": "science", "ex": "science 拼字。"}, {"type": "typing", "p": "星期六（英文單字）", "opts": [], "ans": "Saturday", "ex": "Saturday。"}, {"type": "typing", "p": "音樂（英文單字）", "opts": [], "ans": "music", "ex": "music。"}];const KEY='english_review_v1';let state={page:'home',session:null};const app=document.getElementById('app');const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function shuffle(x){let a=[...x];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function data(){try{return JSON.parse(localStorage.getItem(KEY))||{records:[]}}catch{return {records:[]}}}function screen(p){state.page=p;state.session=null;render();scrollTo({top:0,behavior:'smooth'})}function render(){if(state.page==='home')home();else if(state.page==='history')history();else if(!state.session)setup();else question()}function home(){app.innerHTML=`<div class="card"><span class="badge">先複習再測驗</span><h2>今天的任務</h2><p>單字、星期、科目、Do / Does、be 動詞、現在進行式、介系詞，以及看圖回答。</p><p>目前有 <b>${Q.length}</b> 道題目；正式考試每次會把題目和選項洗牌。</p><button onclick="screen('practice')">開始練習</button></div><div class="card"><h2>Unit 1｜What Day Is Today?</h2><p><b>星期：</b>Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday</p><p><b>句型：</b>What day is today? → It's Friday. / Is it Monday today? → No, it isn't.</p><p><b>注意：</b>星期首字母大寫，tomorrow 表示明天。</p></div><div class="card"><h2>Unit 2｜Do You Have PE Class?</h2><p><b>科目：</b>math, English, Chinese, science, social studies, art, music, PE</p><p><b>句型：</b>Do you have math class on Monday? → Yes, I do. / Does he have English class on Thursday? → No, he doesn't.</p><p><b>文法：</b>Do＋I/you/we/they；Does＋he/she/it。Does 後一律用原形 have，科目通常不加 a/an。</p></div><div class="card"><h2>生活句型補充</h2><p><b>現在進行式：</b>He is sleeping under the table. / Tom and Peter are playing.</p><p><b>位置：</b>under the table、on the desk、by the box、in the kitchen。</p><p><b>感官：</b>see 看、hear 聽、smell 聞、taste 嚐、feel 感覺。</p><p><b>數字：</b>ten / twenty / thirty / forty / fifty / sixty / seventy / eighty / ninety / one hundred。</p></div><div class="note">提醒：原始評量的聽力題需要音檔。這版以同樣知識點改成可自行操作的閱讀與選擇練習，不會假裝是原始聽力測驗。</div>`}function setup(){let exam=state.page==='exam';app.innerHTML=`<div class="card"><span class="badge">${exam?'正式模擬考':'即時練習'}</span><h2>${exam?'準備好了嗎？':'選擇練習內容'}</h2><p>模仿考卷：Vocabulary、Read & Choose、Look & Write、問答句、數字與情境閱讀；包含鍵盤填答。</p><label>練習範圍</label><select id="part"><option value="all">全部題型</option><option value="vocab">Vocabulary 單字</option><option value="grammar">選擇與閱讀理解</option><option value="typing">填字與短答</option></select><p>題數</p><select id="amount"><option value="10">10 題</option><option value="20" selected>20 題</option><option value="30">30 題</option><option value="999">完整題庫（${Q.length} 題）</option></select><p class="muted">80 分及格；錯題會顯示解析。</p><button onclick="start()">開始${exam?'考試':'練習'}</button></div>`}function start(){let f=document.getElementById('part').value,n=+document.getElementById('amount').value;let ids=shuffle(Q.map((q,i)=>i).filter(i=>f==='all'||Q[i].type===f)).slice(0,n);let maps={};ids.forEach(i=>{if(Q[i].opts.length)maps[i]=shuffle(Q[i].opts.map((_,j)=>j))});state.session={ids,maps,index:0,answers:{},exam:state.page==='exam'};question()}function answer(i){let s=state.session,idx=s.ids[s.index];s.answers[idx]=i;question()}function typed(v){let s=state.session,idx=s.ids[s.index];s.answers[idx]=v}function norm(x){return String(x).toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9]/g,'').replace(/^itis/,'its')}function right(i){let q=Q[i],v=state.session.answers[i];return q.type==='typing'?norm(v)===norm(q.ans):v===q.ans}function question(){let s=state.session,idx=s.ids[s.index],q=Q[idx],v=s.answers[idx],done=!s.exam&&v!==undefined,correct=right(idx);let opts=q.opts.length?s.maps[idx].map((orig,k)=>`<button class="${v===orig?'selected':''} ${done?(orig===q.ans?'right':v===orig?'wrong':''):''}" ${done?'disabled':''} onclick="answer(${orig})">${'ABCD'[k]}. ${esc(q.opts[orig])}</button>`).join(''):`<input aria-label="作答" placeholder="請輸入英文答案" value="${esc(v||'')}" oninput="typed(this.value)">`;app.innerHTML=`<div class="card"><span class="badge">${s.exam?'正式考試':'練習'}・${q.type==='vocab'?'單字':q.type==='typing'?'填寫答案':'閱讀／文法'}</span><h2>第 ${s.index+1} / ${s.ids.length} 題</h2><div class="progress"><div style="width:${100*(s.index+1)/s.ids.length}%"></div></div><p class="sentence">${esc(q.p)}</p><div class="choices">${opts}</div>${done?`<div class="answer"><b>${correct?'答對！':'還可以再加強'}</b><p>參考答案：${esc(q.type==='typing'?q.ans:q.opts[q.ans])}</p><p>${esc(q.ex)}</p></div>`:''}<div class="row" style="margin-top:14px"><button class="light" ${s.index===0?'disabled':''} onclick="move(-1)">上一題</button><button onclick="move(1)">${s.index===s.ids.length-1?'交卷':'下一題'}</button></div>${s.exam?'<small>考試模式：交卷後才公布正解。</small>':''}</div>`}function move(dir){let s=state.session,idx=s.ids[s.index],q=Q[idx];if(dir===1&&(s.answers[idx]===undefined||String(s.answers[idx]).trim()==='')){alert('請先作答');return}if(dir===1&&s.index===s.ids.length-1){finish();return}s.index+=dir;question()}function finish(){let s=state.session;let score=s.ids.filter(i=>right(i)).length,percent=Math.round(score/s.ids.length*100);if(s.exam){let d=data();d.records.push({at:new Date().toLocaleString('zh-TW'),score:percent,count:s.ids.length});d.records=d.records.slice(-50);localStorage.setItem(KEY,JSON.stringify(d))}let wrong=s.ids.filter(i=>!right(i));app.innerHTML=`<div class="card"><h2>${percent>=80?'達到通過標準！':'再練習一次會更好！'}</h2><div class="score">${percent} 分</div><p>答對 ${score}/${s.ids.length} 題</p><button onclick="screen('exam')">再考一次</button> <button class="light" onclick="screen('home')">回複習首頁</button></div><div class="card"><h2>錯題解析（${wrong.length}）</h2>${wrong.length?wrong.map(i=>{let q=Q[i];return `<div class="review"><b>${esc(q.p)}</b><p>你的答案：${esc(q.type==='typing'?s.answers[i]:q.opts[s.answers[i]])}</p><p><b>正解：${esc(q.type==='typing'?q.ans:q.opts[q.ans])}</b></p><p>${esc(q.ex)}</p></div>`}).join(''):'全部答對！'}</div>`}function history(){let d=data();app.innerHTML=`<div class="card"><h2>我的模擬考紀錄</h2>${d.records.length?d.records.slice().reverse().map(r=>`<p>${esc(r.at)}：<b>${r.score} 分</b>（${r.count} 題）</p>`).join(''):'目前沒有考試紀錄。'}<p class="muted">成績僅儲存在這台裝置的瀏覽器。</p></div>`}render();</script></body></html>
